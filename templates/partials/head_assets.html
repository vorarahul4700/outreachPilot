{#- Favicons, font preloads and the design system stylesheets.
    Order matters: fonts, tokens, base, components, then page CSS. -#}
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon.ico">

<link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/youngserif-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/static/css/core/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/core/tokens.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/core/base.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/buttons.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/forms.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/chips.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/cards.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/nav.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/footer.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/overlays.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/components/data.css?v={{ asset_v }}">
{%- for sheet in (page_css if page_css is defined else []) %}
<link rel="stylesheet" href="/static/css/pages/{{ sheet }}?v={{ asset_v }}">
{%- endfor %}
