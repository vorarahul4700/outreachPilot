name: Cloud Scout & Autonomous Neon DB Queue Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution Mode: 'queue' (consumes Neon DB scout_jobs) or 'single' (specific keyword/city)"
        required: false
        default: "queue"
        type: choice
        options:
          - queue
          - single
      domain:
        description: "Domain keyword filter for queue (e.g. pharma, it, sales, marketing, or leave blank for any queued)"
        required: false
        default: ""
      city:
        description: "City filter for queue, or target city for single mode"
        required: false
        default: ""
      batch_size:
        description: "Max jobs to process per runner in queue mode"
        required: false
        default: "30"
      keyword:
        description: "Search Keyword (Only for 'single' mode)"
        required: false
        default: ""
      job_id:
        description: "Specific ScoutJob ID (Only for 'single' mode - leave 0 to auto-create)"
        required: false
        default: "0"
      workers:
        description: "Runners to start, 1-20 (queue mode). Scheduled runs use repo variable SCOUT_WORKERS, else 10"
        required: false
        default: "10"
      parallel_jobs:
        description: "Jobs each runner crawls at the same time, 1-4, each in its own Chrome (queue mode). Scheduled runs use SCOUT_PARALLEL_JOBS, else 1"
        required: false
        default: "1"

  schedule:
    # Run every 1 hour at :23 past the hour (avoids top-of-the-hour :00 GitHub queue delays/drops)
    - cron: '23 * * * *'

concurrency:
  group: ${{ github.event_name == 'schedule' && 'cloud-scout-schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan runners
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.plan.outputs.parallel }}
    steps:
      - name: Work out runner and parallel job counts
        id: plan
        env:
          MODE: ${{ github.event.inputs.mode || 'queue' }}
          WORKERS: ${{ github.event.inputs.workers || vars.SCOUT_WORKERS || '10' }}
          PARALLEL: ${{ github.event.inputs.parallel_jobs || vars.SCOUT_PARALLEL_JOBS || '1' }}
        run: |
          # Digits only, clamped: 1-20 runners (free concurrent job limit), 1-4 Chromes per runner (16 GB RAM).
          W=$(printf '%s' "$WORKERS" | tr -cd '0-9'); W=${W:-10}; W=$((10#$W))
          P=$(printf '%s' "$PARALLEL" | tr -cd '0-9'); P=${P:-1}; P=$((10#$P))
          [ "$W" -lt 1 ] && W=1; [ "$W" -gt 20 ] && W=20
          [ "$P" -lt 1 ] && P=1; [ "$P" -gt 4 ] && P=4
          # Single mode runs one job once.
          if [ "$MODE" = "single" ]; then W=1; P=1; fi
          echo "matrix=[$(seq -s, 1 "$W")]" >> "$GITHUB_OUTPUT"
          echo "parallel=$P" >> "$GITHUB_OUTPUT"
          echo "Mode $MODE: $W runner(s) x $P parallel job(s) each."

  cloud_scout_job:
    name: Cloud-Runner-${{ matrix.worker_id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJSON(needs.plan.outputs.matrix) }}

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Chrome Stable & Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget curl gnupg xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Scout Worker
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_COOKIE: ${{ secrets.GOOGLE_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PARALLEL: ${{ needs.plan.outputs.parallel }}
        run: |
          WORKER_ID="${{ matrix.worker_id }}"
          # Stagger runner startup 3s apart to prevent simultaneous concurrency burst against Google
          STAGGER_DELAY=$(( (WORKER_ID - 1) * 3 ))
          if [ "$STAGGER_DELAY" -gt 0 ]; then
            echo "Staggering Runner-$WORKER_ID startup by ${STAGGER_DELAY}s to prevent Google rate-limits..."
            sleep $STAGGER_DELAY
          fi
          # One worker process per parallel job: each has its own display and Chrome and claims its own jobs (SKIP LOCKED).
          PIDS=""
          for J in $(seq 1 "$PARALLEL"); do
            # Starting Chromes 20s apart avoids racing on the shared driver download.
            if [ "$J" -gt 1 ]; then sleep 20; fi
            xvfb-run -n $((90 + J)) -s "-screen 0 1920x1080x24" python cloud_worker.py \
              --mode "${{ github.event.inputs.mode || 'queue' }}" \
              --domain "${{ github.event.inputs.domain }}" \
              --city "${{ github.event.inputs.city }}" \
              --keyword "${{ github.event.inputs.keyword }}" \
              --job-id "${{ github.event.inputs.job_id || '0' }}" \
              --batch-size "${{ github.event.inputs.batch_size || '30' }}" \
              --runner-id "${WORKER_ID}.${J}" &
            PIDS="$PIDS $!"
          done
          FAIL=0
          for PID in $PIDS; do wait "$PID" || FAIL=1; done
          exit $FAIL
