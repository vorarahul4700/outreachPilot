name: Cloud Domain Scout Orchestrator

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target industry domain (it, sales, marketing, pharma, finance, realestate, manufacturing, hr, all)"
        required: true
        default: "pharma"
      tier:
        description: "City tier: tier1 (10 metros), tier2 (19 regional), tier3 (44 hubs), or all (73 cities)"
        required: false
        default: "all"
      cities:
        description: "Optional custom comma-separated cities (e.g. Surat, Mumbai)"
        required: false
        default: ""
      max_pages:
        description: "Max pages per scout job (default 50)"
        required: false
        default: "50"
      delay:
        description: "Delay in seconds between dispatches (default 0.4s for cloud runner)"
        required: false
        default: "0.4"

jobs:
  orchestrate_scouts:
    name: Orchestrate All Domain Scouts in Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours maximum execution time in GitHub cloud

    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv sqlalchemy psycopg2-binary

      - name: Execute Multi-Domain Scout Dispatcher in Cloud
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python var/scratch/run_all_india_scouts.py \
            --domain "${{ github.event.inputs.domain }}" \
            --tier "${{ github.event.inputs.tier }}" \
            --cities "${{ github.event.inputs.cities }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --delay "${{ github.event.inputs.delay }}" \
            --local
